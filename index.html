<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiraSTORE - Zapatillas y Ropa Deportiva</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #111; color: #fff; padding-right: 320px; }
        header { background: #000; padding: 20px; text-align: center; border-bottom: 2px solid #00c853; }
        h1 { margin: 0; color: #00c853; letter-spacing: 2px; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
        
        .card { background: #1c1c1c; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #333; transition: 0.3s; display: flex; flex-direction: column; }
        .card:hover { border-color: #00c853; transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,200,83,0.2); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; }
        
        select { margin-bottom: 15px; padding: 8px; border-radius: 5px; background: #333; color: #fff; border: 1px solid #00c853; cursor: pointer; outline: none; }
        
        button { background: #00c853; color: #fff; border: none; padding: 12px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: auto; transition: 0.2s; }
        button:hover { background: #00a844; }

        /* Carrito Lateral */
        #cart { position: fixed; right: 0; top: 0; background: #000; width: 300px; height: 100%; padding: 20px; overflow-y: auto; border-left: 2px solid #00c853; box-sizing: border-box; display: flex; flex-direction: column; }
        #cart h2 { text-align: center; margin-top: 0; color: #00c853; }
        
        #cart-items { flex-grow: 1; }
        .cart-item { border-bottom: 1px solid #333; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; font-size: 14px; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
        
        .cart-item button { background: #ff4444; padding: 5px 10px; font-size: 12px; margin-top: 0; border: none; border-radius: 3px; color: white; cursor: pointer; }

        .total { font-size: 18px; margin-top: 20px; font-weight: bold; text-align: center; border-top: 1px solid #00c853; padding-top: 10px; }

        @media (max-width: 768px) {
            body { padding-right: 0; padding-bottom: 350px; }
            #cart { width: 100%; height: 350px; top: auto; bottom: 0; border-left: none; border-top: 2px solid #00c853; }
        }
    </style>
</head>
<body>

<header>
    <h1>KiraSTORE</h1>
    <p>Zapatillas y Ropa Deportiva</p>
</header>

<div class="container">
    <div class="card">
        <img src="https://assets.adidas.com/images/h_840,f_auto,q_auto,fl_lossy,c_fill,g_auto/cdad5a382b4d4d5cb9178ccd89e891b9_9366/Zapatillas_Lightshift_Blanco_JH9317_01_00_standard.jpg" alt="Adidas LIGHTSHIFT">
        <h3>Adidas LIGHTSHIFT</h3>
        <p>$100.000</p>
        <label style="font-size: 12px; color: #aaa;">Talle:</label>
        <select id="talle-light">
            <option value="41">41</option>
            <option value="42">42</option>
            <option value="43">43</option>
        </select>
        <button onclick="prepararCompra('Adidas LIGHTSHIFT', 100000, 'talle-light')">Agregar al carrito</button>
    </div>

     <div class="card">
        <img src="https://sporting.vtexassets.com/arquivos/ids/2207082-1200-1200?v=638926746291300000&width=1200&height=1200&aspect=true" alt="Adidas Grand Court Alpha">
        <h3>Adidas Grand Court Alpha</h3>
        <p>$110.000</p>
        <label style="font-size: 12px; color: #aaa;">Talle:</label>
        <select id="talle-alpha">
            <option value="41,5">41,5</option>
        </select>
        <button onclick="prepararCompra('Adidas Grand Court Alpha', 110000, 'talle-alpha')">Agregar al carrito</button>
    </div>

    <div class="card">
        <img src="https://sportotalar.vtexassets.com/arquivos/ids/639925/389390-45-21015-PUMA-WHITE-STRONG-GRAY-ROSE-QUARTZ_1.png?v=638842326664800000" alt="Puma Carina">
        <h3>PUMA CARINA STREET</h3>
        <p>$90.000</p>
        <label style="font-size: 12px; color: #aaa;">Talle:</label>
        <select id="talle-carina">
            <option value="34,5">34,5</option>
            <option value="38">38</option>
            <option value="39">39</option>
        </select>
        <button onclick="prepararCompra('PUMA CARINA STREET', 90000, 'talle-carina')">Agregar al carrito</button>
    </div>

    </div>

<div id="cart">
    <h2>Tu Carrito</h2>
    <div id="cart-items"></div>
    <div class="total" id="total-container">Total: <span id="total-val">$0</span></div>
    <button onclick="finalizarCompra()" style="width:100%; margin-top:20px; background:#25d366; color: #000; font-weight: bold; padding: 15px; border: none; border-radius: 5px; cursor: pointer;">
        Finalizar por WhatsApp
    </button>
</div>

<script>
    let cart = [];

    function prepararCompra(name, price, selectId) {
        const selectElement = document.getElementById(selectId);
        const talleSeleccionado = selectElement.value;
        addToCart(name, price, talleSeleccionado);
    }

    function addToCart(name, price, size) {
        // Buscamos si ya existe el producto con ese talle específico
        const itemExistente = cart.find(item => item.name === name && item.size === size);
        if (itemExistente) {
            itemExistente.cantidad += 1;
        } else {
            cart.push({ name, price, size, cantidad: 1 });
        }
        renderCart();
    }

    function removeFromCart(name, size) {
        cart = cart.filter(item => !(item.name === name && item.size === size));
        renderCart();
    }

    function renderCart() {
        const cartItems = document.getElementById('cart-items');
        const totalContainer = document.getElementById('total-container');
        cartItems.innerHTML = '';
        
        let subtotal = 0;
        let totalArticulos = 0;

        cart.forEach(item => {
            const div = document.createElement('div');
            div.className = 'cart-item';
            div.innerHTML = `
                <div>
                    <strong>${item.name}</strong> <br>
                    <small>Talle: ${item.size} | $${item.price.toLocaleString()} x ${item.cantidad}</small>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span>$${(item.price * item.cantidad).toLocaleString()}</span>
                    <button onclick="removeFromCart('${item.name}', '${item.size}')">X</button>
                </div>
            `;
            cartItems.appendChild(div);
            subtotal += item.price * item.cantidad;
            totalArticulos += item.cantidad;
        });

        let totalFinal = subtotal;
        let mensajeDescuento = "";

        if (totalArticulos >= 2) {
            const descuento = subtotal * 0.10; 
            totalFinal = subtotal - descuento;
            mensajeDescuento = `<div style="color: #00c853; font-size: 14px;">¡10% OFF aplicado!</div>`;
        }

        totalContainer.innerHTML = `
            <div style="${totalArticulos >= 2 ? 'text-decoration: line-through; font-size: 14px; color: #888;' : ''}">
                Subtotal: $${subtotal.toLocaleString()}
            </div>
            <div>Total: $${totalFinal.toLocaleString()}</div>
            ${mensajeDescuento}
        `;
        
        // Guardamos valores para el mensaje de WhatsApp
        totalContainer.dataset.valorFinal = totalFinal.toLocaleString();
        totalContainer.dataset.subtotal = subtotal.toLocaleString();
    }

    function finalizarCompra() {
        if (cart.length === 0) {
            alert("El carrito está vacío");
            return;
        }
        
        let mensaje = "¡Hola KiraSTORE! 👋 Quiero realizar este pedido:%0A%0A";
        let totalArticulos = 0;

        cart.forEach((item, index) => {
            let itemSubtotal = item.price * item.cantidad;
            mensaje += `*Producto ${index + 1}:*%0A`;
            mensaje += `👟 ${item.name}%0A`;
            mensaje += `📏 Talle: ${item.size}%0A`;
            mensaje += `🔢 Cantidad: ${item.cantidad}%0A`;
            mensaje += `💰 Precio unitario: $${item.price.toLocaleString()}%0A`;
            mensaje += `💵 Subtotal: $${itemSubtotal.toLocaleString()}%0A`;
            mensaje += "--------------------------%0A";
            totalArticulos += item.cantidad;
        });
        
        const subtotalGral = document.getElementById('total-container').dataset.subtotal;
        const totalFinal = document.getElementById('total-container').dataset.valorFinal;
        
        mensaje += `%0A*RESUMEN DE COMPRA*%0A`;
        mensaje += `Suma total: $${subtotalGral}%0A`;
        
        if (totalArticulos >= 2) {
            mensaje += "🎁 Descuento: 10% OFF (por 2+ productos)%0A";
        }
        
        mensaje += `%0A*🔥 TOTAL A PAGAR: $${totalFinal}*`;
        
        window.open(`https://wa.me/5491135879173?text=${mensaje}`);
    }
</script>

</body>
</html>
