<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiraSTORE - Zapatillas y Ropa Deportiva</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #111; color: #fff; padding-right: 320px; }
        header { background: #000; padding: 20px; text-align: center; border-bottom: 2px solid #00c853; }
        h1 { margin: 0; color: #00c853; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: #1c1c1c; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #333; transition: 0.3s; display: flex; flex-direction: column; }
        .card:hover { border-color: #00c853; transform: translateY(-5px); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; }
        
        select { margin-bottom: 10px; padding: 8px; border-radius: 5px; background: #333; color: #fff; border: 1px solid #00c853; cursor: pointer; }
        
        button { background: #00c853; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: auto; }
        button:hover { background: #00a844; }

        /* Carrito Lateral */
        #cart { position: fixed; right: 0; top: 0; background: #000; width: 300px; height: 100%; padding: 20px; overflow-y: auto; border-left: 2px solid #00c853; box-sizing: border-box; }
        #cart h2 { text-align: center; margin-top: 0; }
        
        .cart-item { border-bottom: 1px solid #333; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .cart-item button { background: #ff4444; padding: 5px 10px; font-size: 12px; margin-top: 0; }
        .cart-item button:hover { background: #cc0000; }

        .total { font-size: 22px; margin-top: 20px; font-weight: bold; text-align: center; border-top: 1px solid #00c853; padding-top: 10px; }

        /* Responsivo para móviles */
        @media (max-width: 768px) {
            body { padding-right: 0; padding-bottom: 350px; }
            #cart { width: 100%; height: 350px; top: auto; bottom: 0; border-left: none; border-top: 2px solid #00c853; }
        }
    </style>
</head>
<body>

<header>
    <h1>KiraSTORE</h1>
    <p>Zapatillas y Ropa Deportiva</p>
</header>

<div class="container">
    <div class="card">
        <img src="https://t4.ftcdn.net/jpg/04/79/11/23/360_F_479112366_dku6Ufwd9OVnRB3AZxonMgRzuZYeTTYY.jpg" alt="Nike">
        <h3>Nike Air Force 1</h3>
        <p>$220.000</p>
        <label style="font-size: 12px; color: #aaa;">Talle:</label>
        <select id="talle-nike">
            <option value="38">38</option>
            <option value="39">39</option>
            <option value="40">40</option>
            <option value="41">41</option>
            <option value="42">42</option>
        </select>
        <button onclick="prepararCompra('Nike Air Force 1', 220000, 'talle-nike')">Agregar al carrito</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519" alt="Adidas">
        <h3>Adidas Superstar</h3>
        <p>$110.000</p>
        <label style="font-size: 12px; color: #aaa;">Talle:</label>
        <select id="talle-adidas">
            <option value="36">36</option>
            <option value="37">37</option>
            <option value="38">38</option>
            <option value="39">39</option>
        </select>
        <button onclick="prepararCompra('Adidas Superstar', 110000, 'talle-adidas')">Agregar al carrito</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a" alt="Puma">
        <h3>Puma RS-X</h3>
        <p>$100.000</p>
        <label style="font-size: 12px; color: #aaa;">Talle:</label>
        <select id="talle-puma">
            <option value="38">38</option>
            <option value="39">39</option>
            <option value="40">40</option>
        </select>
        <button onclick="prepararCompra('Puma RS-X', 100000, 'talle-puma')">Agregar al carrito</button>
    </div>
</div>

<div id="cart">
    <h2>Tu Carrito</h2>
    <div id="cart-items"></div>
    <div class="total">Total: $<span id="total">0</span></div>
    <button onclick="finalizarCompra()" style="width:100%; margin-top:20px; background:#25d366;">
        Finalizar por WhatsApp
    </button>
</div>

<script>
    let cart = [];

    // Función que lee el selector y envía al carrito
    function prepararCompra(name, price, selectId) {
        const talleSeleccionado = document.getElementById(selectId).value;
        addToCart(name, price, talleSeleccionado);
    }

    function addToCart(name, price, size) {
        // Buscamos si ya existe el par Nombre + Talle exacto
        const itemExistente = cart.find(item => item.name === name && item.size === size);

        if (itemExistente) {
            itemExistente.cantidad += 1;
        } else {
            cart.push({ name, price, size, cantidad: 1 });
        }
        renderCart();
    }

    function removeFromCart(name, size) {
        // Solo eliminamos la combinación específica de nombre y talle
        cart = cart.filter(item => !(item.name === name && item.size === size));
        renderCart();
    }

    function renderCart() {
        const cartItems = document.getElementById('cart-items');
        const totalSpan = document.getElementById('total');
        cartItems.innerHTML = '';
        let total = 0;

        cart.forEach(item => {
            const div = document.createElement('div');
            div.className = 'cart-item';
            div.innerHTML = `
                <div>
                    <strong>${item.name}</strong> <br>
                    <small>Talle: ${item.size} | $${item.price.toLocaleString()} x ${item.cantidad}</small>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span>$${(item.price * item.cantidad).toLocaleString()}</span>
                    <button onclick="removeFromCart('${item.name}', '${item.size}')">X</button>
                </div>
            `;
            cartItems.appendChild(div);
            total += item.price * item.cantidad;
        });

        totalSpan.innerText = total.toLocaleString();
    }

    function finalizarCompra() {
        if (cart.length === 0) {
            alert("El carrito está vacío");
            return;
        }
        
        let mensaje = "Hola KiraSTORE! Quiero comprar:%0A%0A";
        cart.forEach(item => {
            mensaje += `* ${item.name} (Talle: ${item.size}) x${item.cantidad} - $${(item.price * item.cantidad).toLocaleString()}%0A`;
        });
        
        const totalFinal = document.getElementById('total').innerText;
        mensaje += "%0A*Total a pagar: $" + totalFinal + "*";
        
        window.open(`https://wa.me/5491135879173?text=${mensaje}`);
    }
</script>

</body>
</html>
