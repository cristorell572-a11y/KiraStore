<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiraSTORE - Zapatillas y Ropa Deportiva</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #111; color: #fff; padding-right: 320px; }
        header { background: #000; padding: 20px; text-align: center; border-bottom: 2px solid #00c853; }
        h1 { margin: 0; color: #00c853; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: #1c1c1c; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #333; transition: 0.3s; }
        .card:hover { border-color: #00c853; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; }
        
        button { background: #00c853; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #00a844; }

        /* Carrito Lateral */
        #cart { position: fixed; right: 0; top: 0; background: #000; width: 300px; height: 100%; padding: 20px; overflow-y: auto; border-left: 2px solid #00c853; box-sizing: border-box; }
        #cart h2 { text-align: center; margin-top: 0; }
        .cart-item { border-bottom: 1px solid #333; padding: 10px 0; display: flex; justify-content: space-between; font-size: 14px; }
        .total { font-size: 22px; margin-top: 20px; font-weight: bold; text-align: center; border-top: 1px solid #00c853; padding-top: 10px; }

        /* Responsivo para móviles */
        @media (max-width: 768px) {
            body { padding-right: 0; padding-bottom: 300px; }
            #cart { width: 100%; height: 300px; top: auto; bottom: 0; border-left: none; border-top: 2px solid #00c853; }
        }
    </style>
</head>
<body>

<header>
    <h1>KiraSTORE</h1>
    <p>Zapatillas y Ropa Deportiva</p>
</header>

<div class="container">
    <div class="card">
        <img src="https://t4.ftcdn.net/jpg/04/79/11/23/360_F_479112366_dku6Ufwd9OVnRB3AZxonMgRzuZYeTTYY.jpg" alt="Nike">
        <h3>Nike Air Force 1 talle 33</h3>
        <p>$220.000</p>
        <button onclick="addToCart('Nike Air Force 1', 220000)">Agregar al carrito</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519" alt="Adidas">
        <h3>Adidas Superstar</h3>
        <p>$110.000</p>
        <button onclick="addToCart('Adidas Superstar', 110000)">Agregar al carrito</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a" alt="Puma">
        <h3>Puma RS-X</h3>
        <p>$100.000</p>
        <button onclick="addToCart('Puma RS-X', 100000)">Agregar al carrito</button>
    </div>
</div>

<div id="cart">
    <h2>Tu Carrito</h2>
    <div id="cart-items"></div>
    <div class="total">Total: $<span id="total">0</span></div>
    <button onclick="finalizarCompra()" style="width:100%; margin-top:20px; background:#25d366;">
        Finalizar por WhatsApp
    </button>
</div>

<script>
    let cart = [];

    function addToCart(name, price) {
        cart.push({ name, price });
        renderCart();
    }

    function renderCart() {
        const cartItems = document.getElementById('cart-items');
        const totalSpan = document.getElementById('total');
        cartItems.innerHTML = '';
        let total = 0;

        cart.forEach(item => {
            const div = document.createElement('div');
            div.className = 'cart-item';
            div.innerHTML = `<span>${item.name}</span><span>$${item.price.toLocaleString()}</span>`;
            cartItems.appendChild(div);
            total += item.price;
        });

        totalSpan.innerText = total.toLocaleString();
    }

    function finalizarCompra() {
        if (cart.length === 0) {
            alert("El carrito está vacío");
            return;
        }
        
        let mensaje = "Hola KiraSTORE! Quiero comprar:%0A";
        cart.forEach(item => {
            mensaje += `- ${item.name} ($${item.price.toLocaleString()})%0A`;
        });
        
        const totalFinal = document.getElementById('total').innerText;
        mensaje += "%0A*Total a pagar: $" + totalFinal + "*";
        
        // Tu número ya está configurado aquí
        window.open(`https://wa.me/5491135879173?text=${mensaje}`);
    }
</script>

</body>
</html>
